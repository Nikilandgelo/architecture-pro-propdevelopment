apiVersion: v1
kind: Pod
metadata:
  name: pod-hostpath
  namespace: audit-zone
spec:
  containers:
    - name: nginx
      image: nginx
      securityContext:
        privileged: false
        runAsNonRoot: true
        readOnlyRootFilesystem: true
      volumeMounts:
        - name: host-logs
          mountPath: /host-logs
  volumes:
    - name: host-logs
      hostPath:  # bad
        path: /var/log
