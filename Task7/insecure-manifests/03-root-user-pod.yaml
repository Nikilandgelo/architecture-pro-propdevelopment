apiVersion: v1
kind: Pod
metadata:
  name: pod-root
  namespace: audit-zone
spec:
  containers:
    - name: nginx
      image: nginx
      securityContext:
        runAsUser: 0  # bad
        privileged: false
        runAsNonRoot: true
        readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Pod
metadata:
  name: pod-non-root
  namespace: audit-zone
spec:
  containers:
    - name: nginx
      image: nginx
      securityContext:
        runAsUser: 101
        privileged: false
        runAsNonRoot: false  # bad
        readOnlyRootFilesystem: true
