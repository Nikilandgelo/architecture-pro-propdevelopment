apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-security-auditor
rules:
  - apiGroups:
      - ""
    resources:
      - pods
      - services
      - configmaps
      - namespaces
    verbs:
      - get
      - list
      - watch

  - apiGroups:
      - "apps"
    resources:
        - deployments
        - daemonsets
        - statefulsets
    verbs:
      - get
      - list
      - watch

  - apiGroups:
      - "rbac.authorization.k8s.io"
    resources:
      - roles
      - rolebindings
      - clusterroles
      - clusterrolebindings
    verbs:
      - get
      - list
      - watch

  - apiGroups:
      - "networking.k8s.io"
    resources:
        - networkpolicies
    verbs:
      - get
      - list
      - watch
