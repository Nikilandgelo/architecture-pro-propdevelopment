apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-editor
rules:
  - apiGroups:
      - ""
    resources:
      - pods
      - services
      - configmaps
    verbs:
      - create
      - get
      - list
      - watch
      - update
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
        - namespaces
    verbs:
      - get
      - list
      - watch

  - apiGroups:
      - "apps"
    resources:
        - deployments
    verbs:
      - create
      - get
      - list
      - watch
      - update
      - patch
      - delete
  - apiGroups:
      - "apps"
    resources:
      - daemonsets
      - statefulsets
    verbs:
      - get
      - list
      - watch
---


apiVersion: rbac.authorization.k8s.io/v1
