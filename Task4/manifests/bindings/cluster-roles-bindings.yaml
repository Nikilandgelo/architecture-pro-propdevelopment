apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cluster-editor-binding
roleRef:
  kind: ClusterRole
  name: cluster-editor
subjects:
  - kind: User
    name: developer
---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cluster-viewer-binding
roleRef:
  kind: ClusterRole
  name: cluster-viewer
subjects:
  - kind: User
    name: support
---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cluster-security-auditor-binding
roleRef:
  kind: ClusterRole
  name: cluster-security-auditor
subjects:
  - kind: User
    name: info-security
